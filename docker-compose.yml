version: '3.8'

# Local development stack only.
# CockroachDB uses --insecure (no TLS/auth). Do not expose this compose file
# on a shared or production host without a follow-up TLS/auth deployment.

services:
  cockroachdb:
    image: cockroachdb/cockroach:v23.1.11
    container_name: werewolf-cockroachdb
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: unless-stopped
    volumes:
      - cockroachdb_data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    ports:
      # Bind DB / admin UI to localhost only (local-dev)
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    container_name: werewolf-nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
        exec /nakama/nakama
        --config /nakama/data/nakama-config.yml
        --database.address root@cockroachdb:26257
        --console.username "$$NAKAMA_CONSOLE_USERNAME"
        --console.password "$$NAKAMA_CONSOLE_PASSWORD"
        --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
        --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY"
    restart: unless-stopped
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./nakama-config.yml:/nakama/data/nakama-config.yml:ro
      - ./nakama/build:/nakama/data/modules:ro
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"  # gRPC API
      - "7350:7350"  # HTTP API
      # Developer console: localhost only
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - TZ=Asia/Shanghai
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME:?Set NAKAMA_CONSOLE_USERNAME in .env (see .env.example)}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD:?Set NAKAMA_CONSOLE_PASSWORD in .env (see .env.example)}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY:?Set NAKAMA_CONSOLE_SIGNING_KEY in .env (see .env.example)}
      - NAKAMA_RUNTIME_HTTP_KEY=${NAKAMA_RUNTIME_HTTP_KEY:?Set NAKAMA_RUNTIME_HTTP_KEY in .env (see .env.example)}

volumes:
  cockroachdb_data:
    driver: local
