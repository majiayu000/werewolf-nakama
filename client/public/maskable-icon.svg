<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a4a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background with safe area padding (20% on each side for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Moon decoration -->
  <circle cx="400" cy="100" r="40" fill="#f0e68c" opacity="0.3"/>
  <circle cx="385" cy="95" r="35" fill="url(#bg)"/>
  <!-- Wolf head centered with padding -->
  <g transform="translate(128, 128) scale(2.56)">
    <!-- Wolf head silhouette -->
    <path fill="url(#wolfGrad)" d="M50,10 L35,25 L25,20 L30,40 L20,50 L30,55 L25,75 L40,65 L50,90 L60,65 L75,75 L70,55 L80,50 L70,40 L75,20 L65,25 Z"/>
    <!-- Eyes with glow -->
    <circle cx="40" cy="45" r="6" fill="#8b0000" filter="url(#glow)"/>
    <circle cx="60" cy="45" r="6" fill="#8b0000" filter="url(#glow)"/>
    <!-- Eye highlights -->
    <circle cx="40" cy="45" r="2.5" fill="#ff4444"/>
    <circle cx="60" cy="45" r="2.5" fill="#ff4444"/>
    <circle cx="38" cy="43" r="1" fill="#ffcccc"/>
    <circle cx="58" cy="43" r="1" fill="#ffcccc"/>
  </g>
</svg>
