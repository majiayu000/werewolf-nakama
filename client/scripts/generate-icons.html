<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PWA Icon Generator</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #1a1a2e; color: white; }
    .icon-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .icon-item { text-align: center; }
    .icon-item canvas { border: 1px solid #333; }
    .icon-item button { margin-top: 10px; padding: 5px 15px; cursor: pointer; }
    h1 { color: #ff4444; }
    .instructions { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>PWA Icon Generator for 狼人杀</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Download All" to download all PNG icons</li>
      <li>Place the downloaded files in the <code>public/</code> folder</li>
      <li>Required files: pwa-64x64.png, pwa-192x192.png, pwa-512x512.png, maskable-icon-512x512.png, apple-touch-icon.png</li>
    </ol>
    <button onclick="downloadAll()" style="padding: 10px 20px; font-size: 16px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Download All Icons
    </button>
  </div>

  <div class="icon-container" id="icons"></div>

  <script>
    const sizes = [
      { name: 'pwa-64x64.png', size: 64, maskable: false },
      { name: 'pwa-192x192.png', size: 192, maskable: false },
      { name: 'pwa-512x512.png', size: 512, maskable: false },
      { name: 'maskable-icon-512x512.png', size: 512, maskable: true },
      { name: 'apple-touch-icon.png', size: 180, maskable: true },
      { name: 'favicon.ico', size: 32, maskable: false },
    ];

    function drawWolfIcon(ctx, size, maskable) {
      const scale = size / 100;

      // Background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(1, '#0f0f23');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      if (maskable) {
        // For maskable icons, add extra padding (safe area is 80% of icon)
        ctx.save();
        ctx.translate(size * 0.1, size * 0.1);
        ctx.scale(0.8, 0.8);
      }

      // Moon
      ctx.fillStyle = 'rgba(240, 230, 140, 0.3)';
      ctx.beginPath();
      ctx.arc(80 * scale, 20 * scale, 10 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(77 * scale, 19 * scale, 8 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Wolf head
      const wolfGradient = ctx.createLinearGradient(0, 0, size, size);
      wolfGradient.addColorStop(0, '#5a5a6a');
      wolfGradient.addColorStop(1, '#3a3a4a');
      ctx.fillStyle = wolfGradient;

      ctx.beginPath();
      ctx.moveTo(50 * scale, 10 * scale);
      ctx.lineTo(35 * scale, 25 * scale);
      ctx.lineTo(25 * scale, 20 * scale);
      ctx.lineTo(30 * scale, 40 * scale);
      ctx.lineTo(20 * scale, 50 * scale);
      ctx.lineTo(30 * scale, 55 * scale);
      ctx.lineTo(25 * scale, 75 * scale);
      ctx.lineTo(40 * scale, 65 * scale);
      ctx.lineTo(50 * scale, 90 * scale);
      ctx.lineTo(60 * scale, 65 * scale);
      ctx.lineTo(75 * scale, 75 * scale);
      ctx.lineTo(70 * scale, 55 * scale);
      ctx.lineTo(80 * scale, 50 * scale);
      ctx.lineTo(70 * scale, 40 * scale);
      ctx.lineTo(75 * scale, 20 * scale);
      ctx.lineTo(65 * scale, 25 * scale);
      ctx.closePath();
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#8b0000';
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 5 * scale;
      ctx.beginPath();
      ctx.arc(40 * scale, 45 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(60 * scale, 45 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Eye highlights
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(40 * scale, 45 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(60 * scale, 45 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Eye sparkles
      ctx.fillStyle = '#ffcccc';
      ctx.beginPath();
      ctx.arc(38 * scale, 43 * scale, 1 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(58 * scale, 43 * scale, 1 * scale, 0, Math.PI * 2);
      ctx.fill();

      if (maskable) {
        ctx.restore();
      }
    }

    function createIcon(config) {
      const container = document.getElementById('icons');
      const item = document.createElement('div');
      item.className = 'icon-item';

      const canvas = document.createElement('canvas');
      canvas.width = config.size;
      canvas.height = config.size;
      const ctx = canvas.getContext('2d');

      drawWolfIcon(ctx, config.size, config.maskable);

      const label = document.createElement('div');
      label.textContent = config.name + ' (' + config.size + 'x' + config.size + ')';

      const button = document.createElement('button');
      button.textContent = 'Download';
      button.onclick = () => downloadIcon(canvas, config.name);

      item.appendChild(label);
      item.appendChild(canvas);
      item.appendChild(button);
      container.appendChild(item);

      return { canvas, name: config.name };
    }

    function downloadIcon(canvas, name) {
      const link = document.createElement('a');
      link.download = name;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    const canvases = [];
    sizes.forEach(config => {
      canvases.push(createIcon(config));
    });

    function downloadAll() {
      canvases.forEach(({ canvas, name }, index) => {
        setTimeout(() => {
          downloadIcon(canvas, name);
        }, index * 200);
      });
    }
  </script>
</body>
</html>
